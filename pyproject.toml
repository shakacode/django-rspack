[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-rspack"
version = "0.1.0"
description = "Django integration for Rspack, a Rust-powered bundler compatible with webpack"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ShakaCode", email = "contact@shakacode.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "django>=4.2",
    "pyyaml>=6.0",
    "requests>=2.28",
]
keywords = ["django", "rspack", "bundler", "assets", "webpack"]

[project.urls]
Homepage = "https://github.com/shakacode/django-rspack"
Repository = "https://github.com/shakacode/django-rspack"
Issues = "https://github.com/shakacode/django-rspack/issues"
Documentation = "https://github.com/shakacode/django-rspack/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/django_rspack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["django_rspack"]
